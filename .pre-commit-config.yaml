repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # The conda recipe is Jinja-templated YAML, not parseable YAML.
        exclude: ^recipe/meta\.yaml$
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.1
    hooks:
      - id: mypy
        # Library and tests only: benchmarks, examples, and docs are
        # gallery scripts, and annotating matplotlib plumbing has no
        # inference value.
        files: ^(src|tests)/
        additional_dependencies:
          # <2.4: newer numpy stubs use PEP 695 `type` statements, which
          # mypy refuses to parse under python_version = 3.11.
          - numpy>=2,<2.4
        args: [--ignore-missing-imports]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [--skip, B101]

  - repo: https://github.com/pypa/pip-audit
    rev: v2.7.3
    hooks:
      - id: pip-audit
        additional_dependencies:
          # The hook audits its own virtualenv, pip included; keep pip at
          # a version with no known advisories (PYSEC-2026-3721).
          - pip>=26.2
